name: Build installer (Linux + Windows)

# Build Linux / Windows installers. Each job builds the Python gateway
# (which freezes in the OpenVINO runtime) and then runs electron-builder.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "clawd-on-desk/**"
      - "minicpm-sidecar/**"
      - "NOTICE.md"
      - ".github/workflows/build-installer.yml"

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    name: linux-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH


      - name: Build gateway
        working-directory: minicpm-sidecar
        run: ./scripts/build-gateway.sh

      - name: Verify sidecar binaries
        working-directory: minicpm-sidecar/bin/linux-x64
        run: |
          ls -la
          chmod +x minicpm-sidecar/minicpm-sidecar
          ./minicpm-sidecar/minicpm-sidecar --help >/dev/null

      - name: npm install
        working-directory: clawd-on-desk
        run: npm install --no-audit --no-fund


      - name: electron-builder (AppImage + deb)
        working-directory: clawd-on-desk
        run: npx electron-builder --linux --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: |
            clawd-on-desk/dist/*.AppImage
            clawd-on-desk/dist/*.deb
            clawd-on-desk/dist/latest-linux.yml
          if-no-files-found: error
          retention-days: 7

  build-windows:
    runs-on: windows-2022
    name: windows
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: |
          irm https://astral.sh/uv/install.ps1 | iex
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.local\bin"


      - name: Build gateway
        working-directory: minicpm-sidecar
        run: |
          .\scripts\build-gateway.ps1 -Target win-x64
          # The arm64 installer reuses the x64 gateway build — the Electron
          # side differs, the Python side does not.
          $dst = "bin\win-arm64\minicpm-sidecar"
          if (Test-Path $dst) { Remove-Item -Recurse -Force $dst }
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item -Recurse -Force "bin\win-x64\minicpm-sidecar\*" $dst

      - name: Verify sidecar binaries
        working-directory: minicpm-sidecar
        run: |
          Get-ChildItem bin\win-x64\minicpm-sidecar | Select-Object Name,Length
          .\bin\win-x64\minicpm-sidecar\minicpm-sidecar.exe --help | Out-Null
          # Assert the layout: Copy-Item -Recurse nests when the destination
          # already exists, and a nested sidecar is invisible to the app.
          foreach ($t in "win-x64", "win-arm64") {
            if (-not (Test-Path "bin\$t\minicpm-sidecar\minicpm-sidecar.exe")) {
              throw "$t gateway missing, or nested one level too deep"
            }
          }

      - name: Download ARM64 VC++ Redistributable
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.arm64.exe" `
            -OutFile "clawd-on-desk\build\vc_redist.arm64.exe"

      - name: npm install
        working-directory: clawd-on-desk
        shell: cmd
        run: npm install --no-audit --no-fund


      - name: electron-builder (nsis)
        working-directory: clawd-on-desk
        shell: cmd
        run: npx electron-builder --win --x64 --arm64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            clawd-on-desk/dist/*.exe
            clawd-on-desk/dist/*.exe.blockmap
            clawd-on-desk/dist/latest.yml
          if-no-files-found: error
          retention-days: 7
